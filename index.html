<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prontuário Psicológico | Daniele Sousa Santos</title>
    <!-- Tailwind CSS para Design Responsivo em Tons de Rosa -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js para Geração de PDF Integral em Múltiplas Páginas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rosebrand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .pdf-page-break { page-break-after: always; break-after: page; }
        .pdf-avoid-break { page-break-inside: avoid; break-inside: avoid; }
    </style>
</head>
<body class="bg-rosebrand-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- BARRA DE NAVEGAÇÃO SUPERIOR COM IDENTIFICAÇÃO PROFISSIONAL -->
    <header class="bg-rosebrand-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <button id="btn-back" onclick="app.goBack()" class="hidden bg-rosebrand-800 hover:bg-rosebrand-900 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition">
                    ← VOLTAR
                </button>
                <div>
                    <h1 class="text-lg font-bold leading-tight">DANIELE SOUSA SANTOS</h1>
                    <p class="text-xs text-rosebrand-200">Psicóloga — CRP 22/07398</p>
                </div>
            </div>
            <nav id="main-nav" class="hidden flex items-center space-x-2">
                <button onclick="app.navigate('dashboard')" class="hover:bg-rosebrand-800 px-3 py-1.5 rounded-lg text-sm font-medium transition">Dashboard</button>
                <button onclick="app.navigate('pacientes')" class="hover:bg-rosebrand-800 px-3 py-1.5 rounded-lg text-sm font-medium transition">Pacientes</button>
                <button onclick="app.navigate('financeiro')" class="hover:bg-rosebrand-800 px-3 py-1.5 rounded-lg text-sm font-medium transition">Financeiro</button>
                <button onclick="app.logout()" class="bg-rosebrand-900 hover:bg-black px-3 py-1.5 rounded-lg text-sm font-medium transition">Sair</button>
            </nav>
        </div>
    </header>

    <!-- NOTIFICAÇÃO / TOAST GLOBAL -->
    <div id="toast" class="hidden fixed top-16 right-4 z-50 p-4 rounded-xl shadow-2xl text-white font-semibold transition-all duration-300"></div>

    <!-- CONTEÚDO DINÂMICO PRINCIPAL -->
    <main id="app-content" class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <!-- Renderizado dinamicamente pelo JavaScript -->
    </main>

    <!-- CONTAINER OCULTO PARA MONTAGEM E IMPRESSÃO DO PDF -->
    <div id="pdf-render-area" class="hidden bg-white p-8 text-black"></div>

    <script>
        /**
         * BANCO DE DADOS PERSISTENTE INDEXEDDB
         * Garante que evoluções e pacientes fiquem salvos localmente antes de gerar qualquer PDF.
         */
        class LocalDatabase {
            constructor() {
                this.dbName = 'ProntuarioPsico_DanieleSousa';
                this.version = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);

                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('pacientes')) {
                            db.createObjectStore('pacientes', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('sessoes')) {
                            const store = db.createObjectStore('sessoes', { keyPath: 'id' });
                            store.createIndex('pacienteId', 'pacienteId', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('evolucoes')) {
                            const store = db.createObjectStore('evolucoes', { keyPath: 'id' });
                            store.createIndex('sessaoId', 'sessaoId', { unique: true });
                            store.createIndex('pacienteId', 'pacienteId', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('pdfs')) {
                            const store = db.createObjectStore('pdfs', { keyPath: 'id' });
                            store.createIndex('pacienteId', 'pacienteId', { unique: false });
                        }
                    };

                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };
                    request.onerror = () => reject('Erro ao inicializar o banco de dados local.');
                });
            }

            async getAll(storeName) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                });
            }

            async getById(storeName, id) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.get(id);
                    req.onsuccess = () => resolve(req.result);
                });
            }

            async getByIndex(storeName, indexName, value) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const index = store.index(indexName);
                    const req = index.getAll(value);
                    req.onsuccess = () => resolve(req.result || []);
                });
            }

            async put(storeName, data) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.put(data);
                    req.onsuccess = () => resolve(data);
                    req.onerror = () => reject('Falha ao gravar no banco de dados.');
                });
            }

            async delete(storeName, id) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    store.delete(id);
                    tx.oncomplete = () => resolve();
                });
            }
        }

        /**
         * LÓGICA PRINCIPAL DO SISTEMA
         */
        class ProntuarioApp {
            constructor() {
                this.db = new LocalDatabase();
                this.historyStack = [];
                this.currentView = 'login';
                this.currentParams = null;
                this.authenticated = false;
                this.hasUnsavedChanges = false;
            }

            async init() {
                await this.db.init();
                this.render();
            }

            showToast(msg, isError = false) {
                const toast = document.getElementById('toast');
                toast.innerHTML = msg;
                toast.className = `fixed top-16 right-4 z-50 p-4 rounded-xl shadow-2xl text-white font-bold transition-all duration-300 ${
                    isError ? 'bg-red-600 border-2 border-red-800' : 'bg-green-600 border-2 border-green-800'
                }`;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 4500);
            }

            navigate(view, params = null, pushHistory = true) {
                if (this.hasUnsavedChanges) {
                    if (!confirm("⚠️ Você possui alterações não salvas na evolução! Deseja realmente sair sem salvar?")) {
                        return;
                    }
                    this.hasUnsavedChanges = false;
                }

                if (pushHistory && this.currentView && this.currentView !== 'login') {
                    this.historyStack.push({ view: this.currentView, params: this.currentParams });
                }
                this.currentView = view;
                this.currentParams = params;

                const btnBack = document.getElementById('btn-back');
                if (this.historyStack.length > 0 && this.authenticated) {
                    btnBack.classList.remove('hidden');
                } else {
                    btnBack.classList.add('hidden');
                }

                this.render();
            }

            goBack() {
                if (this.hasUnsavedChanges) {
                    if (!confirm("⚠️ Você possui alterações não salvas na evolução! Deseja realmente voltar sem salvar?")) {
                        return;
                    }
                    this.hasUnsavedChanges = false;
                }

                if (this.historyStack.length > 0) {
                    const last = this.historyStack.pop();
                    this.currentView = last.view;
                    this.currentParams = last.params;
                    if (this.historyStack.length === 0) {
                        document.getElementById('btn-back').classList.add('hidden');
                    }
                    this.render();
                }
            }

            logout() {
                this.authenticated = false;
                this.historyStack = [];
                document.getElementById('main-nav').classList.add('hidden');
                document.getElementById('btn-back').classList.add('hidden');
                this.navigate('login', null, false);
            }

            async render() {
                const container = document.getElementById('app-content');
                container.innerHTML = '';

                if (!this.authenticated && this.currentView !== 'login') {
                    this.currentView = 'login';
                }

                switch (this.currentView) {
                    case 'login':
                        this.renderLogin(container);
                        break;
                    case 'dashboard':
                        await this.renderDashboard(container);
                        break;
                    case 'pacientes':
                        await this.renderPacientes(container);
                        break;
                    case 'cadastro-paciente':
                        await this.renderCadastroPaciente(container, this.currentParams);
                        break;
                    case 'prontuario':
                        await this.renderProntuario(container, this.currentParams);
                        break;
                    case 'evolucao-form':
                        await this.renderEvolucaoForm(container, this.currentParams);
                        break;
                    case 'financeiro':
                        await this.renderFinanceiro(container);
                        break;
                    default:
                        this.renderLogin(container);
                }
            }

            // -----------------------------------------------------------------
            // LOGIN E AUTENTICAÇÃO
            // -----------------------------------------------------------------
            renderLogin(container) {
                container.innerHTML = `
                    <div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-2xl shadow-xl border-t-8 border-rosebrand-600 space-y-6">
                        <div class="text-center">
                            <h2 class="text-2xl font-bold text-rosebrand-900">Acesso ao Prontuário</h2>
                            <p class="text-sm text-gray-500 mt-1"> Daniele Sousa Santos | CRP 22/07398</p>
                        </div>
                        <form onsubmit="app.handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700">Usuário / E-mail</label>
                                <input type="text" id="login-user" required value="daniele.psico" class="w-full border border-rosebrand-200 rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-rosebrand-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-gray-700">Senha</label>
                                <input type="password" id="login-pass" required value="123456" class="w-full border border-rosebrand-200 rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-rosebrand-500 outline-none">
                            </div>
                            <button type="submit" class="w-full bg-rosebrand-600 hover:bg-rosebrand-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                                Entrar no Sistema
                            </button>
                        </form>
                    </div>
                `;
            }

            handleLogin(e) {
                e.preventDefault();
                this.authenticated = true;
                document.getElementById('main-nav').classList.remove('hidden');
                this.showToast('🟢 Login realizado com sucesso!');
                this.navigate('dashboard', null, false);
            }

            // -----------------------------------------------------------------
            // DASHBOARD COM ALERTAS VERMELHOS CLICÁVEIS
            // -----------------------------------------------------------------
            async renderDashboard(container) {
                const pacientes = await this.db.getAll('pacientes');
                const sessoes = await this.db.getAll('sessoes');
                const evolucoes = await this.db.getAll('evolucoes');

                const ativos = pacientes.filter(p => p.status === 'Ativo').length;
                const inativos = pacientes.filter(p => p.status === 'Inativo').length;

                const realizadas = sessoes.filter(s => s.status === 'Realizada').length;
                const agendadas = sessoes.filter(s => s.status === 'Agendada').length;
                const faltas = sessoes.filter(s => s.status === 'Falta' || s.status === 'Cancelada').length;

                let recebido = 0;
                let pendente = 0;
                sessoes.forEach(s => {
                    const val = parseFloat(s.valor || 0);
                    if (s.pago) recebido += val;
                    else pendente += val;
                });

                // Mapeamento de Pendências Locais
                const pendencias = [];
                for (let s of sessoes) {
                    const pac = pacientes.find(p => p.id === s.pacienteId);
                    const pacNome = pac ? pac.nome : 'Paciente Desconhecido';

                    if (s.status === 'Realizada') {
                        const evo = evolucoes.find(e => e.sessaoId === s.id);
                        if (!evo) {
                            pendencias.push({
                                msg: `🔴 Sessão realizada sem evolução salva: ${pacNome} (${s.data})`,
                                action: () => this.navigate('evolucao-form', { pacienteId: s.pacienteId, sessaoId: s.id })
                            });
                        }
                        if (s.pago && !s.reciboAnexado) {
                            pendencias.push({
                                msg: `🔴 Pagamento recebido sem recibo: ${pacNome} (${s.data})`,
                                action: () => this.navigate('prontuario', s.pacienteId)
                            });
                        }
                    }
                }

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h2 class="text-2xl font-bold text-rosebrand-900">Painel Geral (Dashboard)</h2>
                                <p class="text-xs text-gray-500">Acompanhamento e alertas do consultório</p>
                            </div>
                            <button onclick="app.navigate('cadastro-paciente')" class="bg-rosebrand-600 hover:bg-rosebrand-700 text-white font-bold px-4 py-2 rounded-xl shadow transition">
                                + Cadastrar Novo Paciente
                            </button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-rosebrand-600">
                                <p class="text-xs font-bold text-gray-500 uppercase">Pacientes</p>
                                <p class="text-2xl font-extrabold text-gray-800 mt-1">${pacientes.length}</p>
                                <p class="text-xs text-gray-400 mt-1">${ativos} Ativos | ${inativos} Inativos</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-rosebrand-600">
                                <p class="text-xs font-bold text-gray-500 uppercase">Sessões</p>
                                <p class="text-2xl font-extrabold text-gray-800 mt-1">${realizadas}</p>
                                <p class="text-xs text-gray-400 mt-1">${agendadas} Agendadas | ${faltas} Faltas/Canc.</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
                                <p class="text-xs font-bold text-gray-500 uppercase">Recebido</p>
                                <p class="text-2xl font-extrabold text-green-600 mt-1">R$ ${recebido.toFixed(2)}</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500">
                                <p class="text-xs font-bold text-gray-500 uppercase">Pendente</p>
                                <p class="text-2xl font-extrabold text-red-600 mt-1">R$ ${pendente.toFixed(2)}</p>
                            </div>
                        </div>

                        <!-- AVISOS E PENDÊNCIAS VERMELHAS -->
                        <div class="bg-white p-6 rounded-xl shadow space-y-3">
                            <h3 class="text-lg font-bold text-red-700 flex items-center gap-2">
                                Avisos e Pendências do Consultório
                            </h3>
                            ${pendencias.length === 0 ? `
                                <p class="text-sm text-green-700 font-semibold bg-green-50 p-3 rounded-lg border border-green-200">
                                    🟢 Todas as evoluções e documentos estão em dia no sistema!
                                </p>
                            ` : `
                                <div class="space-y-2">
                                    ${pendencias.map((p, idx) => `
                                        <div class="bg-red-50 border border-red-200 p-3 rounded-lg flex justify-between items-center text-sm font-semibold text-red-900">
                                            <span>${p.msg}</span>
                                            <button onclick="app.executependencia(${idx})" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-lg transition">
                                                Resolver
                                            </button>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>
                    </div>
                `;

                this._tempPendencias = pendencias;
            }

            executependencia(idx) {
                if (this._tempPendencias && this._tempPendencias[idx]) {
                    this._tempPendencias[idx].action();
                }
            }

            // -----------------------------------------------------------------
            // LISTA E FILTRO DE PACIENTES
            // -----------------------------------------------------------------
            async renderPacientes(container) {
                const pacientes = await this.db.getAll('pacientes');

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h2 class="text-2xl font-bold text-rosebrand-900">Gestão de Pacientes</h2>
                            <button onclick="app.navigate('cadastro-paciente')" class="bg-rosebrand-600 hover:bg-rosebrand-700 text-white font-bold px-4 py-2 rounded-xl shadow transition">
                                + Novo Paciente
                            </button>
                        </div>

                        <div class="bg-white p-4 rounded-xl shadow flex flex-col md:flex-row gap-4">
                            <input type="text" id="filter-search" oninput="app.filterPacientes()" placeholder="Pesquisar por nome do paciente..." class="flex-1 border border-rosebrand-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-rosebrand-500 outline-none">
                            <select id="filter-status" onchange="app.filterPacientes()" class="border border-rosebrand-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-rosebrand-500 outline-none">
                                <option value="TODOS">Todos os Status</option>
                                <option value="Ativo" selected>Ativos</option>
                                <option value="Inativo">Inativos</option>
                            </select>
                            <select id="filter-tipo" onchange="app.filterPacientes()" class="border border-rosebrand-200 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-rosebrand-500 outline-none">
                                <option value="TODOS">Todos os Tipos</option>
                                <option value="Adulto">Adulto</option>
                                <option value="Infantil">Infantil</option>
                            </select>
                        </div>

                        <div class="bg-white rounded-xl shadow overflow-hidden border border-rosebrand-100">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-rosebrand-100 text-rosebrand-900 text-xs font-bold uppercase">
                                    <tr>
                                        <th class="p-4">Paciente</th>
                                        <th class="p-4">Tipo</th>
                                        <th class="p-4">Contato</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4 text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="pacientes-table-body" class="divide-y divide-rosebrand-50 text-sm">
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                this._cachedPacientes = pacientes;
                this.filterPacientes();
            }

            filterPacientes() {
                const search = (document.getElementById('filter-search')?.value || '').toLowerCase();
                const status = document.getElementById('filter-status')?.value || 'TODOS';
                const tipo = document.getElementById('filter-tipo')?.value || 'TODOS';

                const list = this._cachedPacientes.filter(p => {
                    const mSearch = p.nome.toLowerCase().includes(search);
                    const mStatus = status === 'TODOS' || p.status === status;
                    const mTipo = tipo === 'TODOS' || p.tipoAtendimento === tipo;
                    return mSearch && mStatus && mTipo;
                });

                const tbody = document.getElementById('pacientes-table-body');
                if (!tbody) return;

                if (list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-500">Nenhum paciente encontrado.</td></tr>`;
                    return;
                }

                tbody.innerHTML = list.map(p => `
                    <tr class="hover:bg-rosebrand-50/50 transition">
                        <td class="p-4 font-bold text-gray-900">${p.nome}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded-full text-xs font-bold ${p.tipoAtendimento === 'Infantil' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                                ${p.tipoAtendimento}
                            </span>
                        </td>
                        <td class="p-4 text-gray-600">${p.telefone || '-'}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded-full text-xs font-bold ${p.status === 'Ativo' ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-600'}">
                                ${p.status}
                            </span>
                        </td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="app.navigate('prontuario', '${p.id}')" class="bg-rosebrand-600 hover:bg-rosebrand-700 text-white text-xs px-3 py-1.5 rounded-lg transition font-bold shadow-sm">
                                Abrir Prontuário
                            </button>
                            <button onclick="app.navigate('cadastro-paciente', '${p.id}')" class="text-xs text-rosebrand-700 hover:underline font-semibold">Editar</button>
                            <button onclick="app.togglePacienteStatus('${p.id}')" class="text-xs text-gray-500 hover:underline">
                                ${p.status === 'Ativo' ? 'Inativar' : 'Reativar'}
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            async togglePacienteStatus(id) {
                const pac = await this.db.getById('pacientes', id);
                if (pac) {
                    pac.status = pac.status === 'Ativo' ? 'Inativo' : 'Ativo';
                    await this.db.put('pacientes', pac);
                    this.showToast(`Status do paciente alterado para ${pac.status}.`);
                    this.renderPacientes(document.getElementById('app-content'));
                }
            }

            // -----------------------------------------------------------------
            // CADASTRO DE PACIENTES (SEMPRE PERSISTIDO)
            // -----------------------------------------------------------------
            async renderCadastroPaciente(container, pacienteId = null) {
                let pac = null;
                if (pacienteId) {
                    pac = await this.db.getById('pacientes', pacienteId);
                }

                container.innerHTML = `
                    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-lg space-y-6 border-t-4 border-rosebrand-600">
                        <h2 class="text-xl font-bold text-rosebrand-900">${pac ? 'Editar Paciente' : 'Cadastrar Novo Paciente'}</h2>
                        
                        <form onsubmit="app.savePaciente(event, '${pacienteId || ''}')" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700">Nome Completo do Paciente *</label>
                                <input type="text" id="p-nome" required value="${pac?.nome || ''}" class="w-full border border-rosebrand-200 rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-rosebrand-500 outline-none">
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-bold text-gray-700">Tipo de Atendimento *</label>
                                    <select id="p-tipo" onchange="app.toggleInfantilFields(this.value)" required class="w-full border border-rosebrand-200 rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-rosebrand-500 outline-none">
                                        <option value="Adulto" ${pac?.tipoAtendimento === 'Adulto' ? 'selected' : ''}>Adulto</option>
                                        <option value="Infantil" ${pac?.tipoAtendimento === 'Infantil' ? 'selected' : ''}>Infantil</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700">Telefone / WhatsApp</label>

            async criarSessaoRapida(pacienteId) {
                const dataStr = prompt("Data da sessão (AAAA-MM-DD):", new Date().toISOString().split('T')[0]);
                if (!dataStr) return;

                const novaSessao = {
                    id: 'ses_' + Date.now(),
                    pacienteId: pacienteId,
                    data: dataStr,
                    horario: '14:00',
                    status: 'Realizada',
                    valor: 150.00,
                    pago: false,
                    reciboAnexado: false
                };

                await this.db.put('sessoes', novaSessao);
                this.showToast('Sessão registrada com sucesso!');
                this.render();
            }

            async togglePagamento(sessaoId) {
                const s = await this.db.getById('sessoes', sessaoId);
                if (s) {
                    s.pago = !s.pago;
                    await this.db.put('sessoes', s);
                    this.showToast('Status financeiro atualizado!');
                    this.render();
                }
            }

            async toggleRecibo(sessaoId) {
                const s = await this.db.getById('sessoes', sessaoId);
                if (s) {
                    s.reciboAnexado = !s.reciboAnexado;
                    await this.db.put('sessoes', s);
                    this.showToast('Status do recibo atualizado!');
                    this.render();
                }
            }

            async salvarEvolucaoComConfirmacao(e, pacienteId, sessaoId) {
                e.preventDefault();
                try {
                    const evolucoes = await this.db.getByIndex('evolucoes', 'sessaoId', sessaoId);
                    const evoExistente = evolucoes.length > 0 ? evolucoes[0] : null;

                    const novaEvolucao = {
                        id: evoExistente ? evoExistente.id : 'evo_' + Date.now(),
                        pacienteId: pacienteId,
                        sessaoId: sessaoId,
                        queixa: document.getElementById('evo-queixa').value.trim(),
                        demanda: document.getElementById('evo-demanda').value.trim(),
                        descricao: document.getElementById('evo-descricao').value.trim(),
                        analise: document.getElementById('evo-analise').value.trim(),
                        dataModificacao: new Date().toISOString()
                    };

                    await this.db.put('evolucoes', novaEvolucao);
                    this.hasUnsavedChanges = false;

                    this.showToast('🟢 EVOLUÇÃO SALVA COM SUCESSO');
                    this.navigate('prontuario', pacienteId);
                } catch (err) {
                    this.showToast('🔴 ERRO AO SALVAR EVOLUÇÃO NO BANCO DE DADOS.', true);
                }
            }

            // -----------------------------------------------------------------

            // -----------------------------------------------------------------
            async gerarPDFIntegralDoProntuario(pacienteId) {
                const pac = await this.db.getById('pacientes', pacienteId);
                const sessoes = await this.db.getByIndex('sessoes', 'pacienteId', pacienteId);

                renderArea.classList.remove('hidden');

                renderArea.innerHTML = `
                    <div style="font-family: Arial, sans-serif; color: #111; line-height: 1.4;">

                            <p style="font-size: 12px; font-weight: bold; color: #444; margin: 2px 0 0 0;">Psicóloga — CRP 22/07398</p>

                        <div style="background-color: #fff1f2; border: 1px solid #fecdd3; padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: 11px;">
                            <p style="margin: 2px 0;"><strong>PACIENTE:</strong> ${pac.nome}</p>
                            <p style="margin: 2px 0;"><strong>MODALIDADE DE ATENDIMENTO:</strong> ${pac.tipoAtendimento}</p>
                            <p style="margin: 2px 0;"><strong>CONTATO:</strong> ${pac.telefone || 'Não informado'}</p>
                            ${pac.tipoAtendimento === 'Infantil' ? `<p style="margin: 2px 0;"><strong>RESPONSÁVEL LEGAL:</strong> ${pac.responsavel?.nome} (${pac.responsavel?.parentesco}) - Tel: ${pac.responsavel?.telefone}</p>` : ''}
                            <p style="margin: 2px 0;"><strong>DATA DE EMISSÃO DO DOCUMENTO:</strong> ${new Date().toLocaleDateString('pt-BR')}</p>

                        <h3 style="font-size: 13px; color: #be123c; border-bottom: 1px solid #ddd; padding-bottom: 4px; font-weight: bold;">EVOLUÇÕES CLÍNICAS REGISTRADAS</h3>

                        ${sessoes.map(s => {

                                        <div style="margin-top: 6px;">

                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        }

        // Instanciação da Aplicação
        const app = new ProntuarioApp();
        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
