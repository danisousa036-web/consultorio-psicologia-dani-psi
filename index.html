<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Prontuário Psicológico</title>
    <!-- Tailwind CSS CDN para Estilização Responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js para Geração do PDF Integral sem cortes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Configuração de Cores da Identidade Visual Rosa -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f472b6',
                            400: '#e879f9',
                            500: '#ec4899',
                            600: '#db2777',
                            700: '#be185d',
                            800: '#9d174d',
                            900: '#831843',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .pdf-page-break { page-break-after: always; break-after: page; }
        .pdf-avoid-break { page-break-inside: avoid; break-inside: avoid; }
    </style>
</head>
<body class="bg-brand-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- CABEÇALHO / NAVEGAÇÃO -->
    <header class="bg-brand-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <button id="btn-back" onclick="app.goBack()" class="hidden bg-brand-700 hover:bg-brand-800 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition">
                    ← Voltar
                </button>
                <h1 class="text-xl font-bold tracking-wide">Prontuário Psicológico</h1>
            </div>
            <nav class="flex space-x-2">
                <button onclick="app.navigate('dashboard')" class="hover:bg-brand-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">Dashboard</button>
                <button onclick="app.navigate('pacientes')" class="hover:bg-brand-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">Pacientes</button>
                <button onclick="app.navigate('financeiro')" class="hover:bg-brand-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">Financeiro</button>
            </nav>
        </div>
    </header>

    <!-- NOTIFICAÇÃO / ALERTA GLOBAL DE CONFIRMAÇÃO -->
    <div id="toast" class="hidden fixed top-16 right-4 z-50 p-4 rounded-xl shadow-xl text-white font-semibold transition-all duration-300"></div>

    <!-- CONTEÚDO PRINCIPAL (MUDANÇA DE TELAS DINÂMICA) -->
    <main id="app-content" class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <!-- Renderizado via JavaScript -->
    </main>

    <!-- AREA OCULTA PARA IMPRESSÃO/GERAÇÃO DE PDF INTEGRAL -->
    <div id="pdf-container" class="hidden bg-white p-8 text-black"></div>

    <!-- SCRIPT DA APLICAÇÃO E BANCO DE DADOS INDEXEDDB -->
    <script>
        /**
         * CAMADA DE BANCO DE DADOS PERSISTENTE (IndexedDB)
         * Garante que nenhum dado seja armazenado apenas em memória temporária.
         */
        class Database {
            constructor() {
                this.dbName = 'ProntuarioPsicologiaDB';
                this.version = 1;
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.version);

                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('pacientes')) {
                            db.createObjectStore('pacientes', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('sessoes')) {
                            const store = db.createObjectStore('sessoes', { keyPath: 'id' });
                            store.createIndex('pacienteId', 'pacienteId', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('evolucoes')) {
                            const store = db.createObjectStore('evolucoes', { keyPath: 'id' });
                            store.createIndex('sessaoId', 'sessaoId', { unique: true });
                            store.createIndex('pacienteId', 'pacienteId', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('pdf_documentos')) {
                            const store = db.createObjectStore('pdf_documentos', { keyPath: 'id' });
                            store.createIndex('pacienteId', 'pacienteId', { unique: false });
                        }
                    };

                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };

                    request.onerror = (e) => reject('Erro ao abrir o banco de dados.');
                });
            }

            async getAll(storeName) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result || []);
                });
            }

            async getById(storeName, id) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const request = store.get(id);
                    request.onsuccess = () => resolve(request.result);
                });
            }

            async getByIndex(storeName, indexName, value) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const index = store.index(indexName);
                    const request = index.getAll(value);
                    request.onsuccess = () => resolve(request.result || []);
                });
            }

            async put(storeName, data) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const request = store.put(data);
                    request.onsuccess = () => resolve(data);
                    request.onerror = () => reject('Erro ao persistir os dados.');
                });
            }

            async delete(storeName, id) {
                return new Promise((resolve) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    store.delete(id);
                    tx.oncomplete = () => resolve();
                });
            }
        }

        /**
         * NÚCLEO DA APLICAÇÃO (REGRA DE NEGÓCIO E INTERFACE)
         */
        class App {
            constructor() {
                this.db = new Database();
                this.historyStack = [];
                this.currentView = 'dashboard';
                this.currentParams = null;
            }

            async init() {
                await this.db.init();
                this.navigate('dashboard', null, false);
            }

            showToast(msg, isError = false) {
                const toast = document.getElementById('toast');
                toast.textContent = msg;
                toast.className = `fixed top-16 right-4 z-50 p-4 rounded-xl shadow-xl text-white font-semibold transition-all duration-300 ${
                    isError ? 'bg-red-600' : 'bg-green-600'
                }`;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 4000);
            }

            navigate(view, params = null, pushHistory = true) {
                if (pushHistory && this.currentView) {
                    this.historyStack.push({ view: this.currentView, params: this.currentParams });
                }
                this.currentView = view;
                this.currentParams = params;

                const btnBack = document.getElementById('btn-back');
                if (this.historyStack.length > 0) {
                    btnBack.classList.remove('hidden');
                } else {
                    btnBack.classList.add('hidden');
                }

                this.render();
            }

            goBack() {
                if (this.historyStack.length > 0) {
                    const last = this.historyStack.pop();
                    this.currentView = last.view;
                    this.currentParams = last.params;
                    if (this.historyStack.length === 0) {
                        document.getElementById('btn-back').classList.add('hidden');
                    }
                    this.render();
                }
            }

            async render() {
                const container = document.getElementById('app-content');
                container.innerHTML = '';

                switch (this.currentView) {
                    case 'dashboard':
                        await this.renderDashboard(container);
                        break;
                    case 'pacientes':
                        await this.renderPacientes(container);
                        break;
                    case 'cadastro-paciente':
                        await this.renderCadastroPaciente(container);
                        break;
                    case 'prontuario':
                        await this.renderProntuario(container, this.currentParams);
                        break;
                    case 'evolucao-form':
                        await this.renderEvolucaoForm(container, this.currentParams);
                        break;
                    case 'financeiro':
                        await this.renderFinanceiro(container);
                        break;
                    default:
                        await this.renderDashboard(container);
                }
            }

            // -----------------------------------------------------------------
            // 1. DASHBOARD COM ALERTAS DE PENDÊNCIAS
            // -----------------------------------------------------------------
            async renderDashboard(container) {
                const pacientes = await this.db.getAll('pacientes');
                const sessoes = await this.db.getAll('sessoes');
                const evolucoes = await this.db.getAll('evolucoes');

                const ativos = pacientes.filter(p => p.status === 'Ativo').length;
                const inativos = pacientes.filter(p => p.status === 'Inativo').length;

                const realizadas = sessoes.filter(s => s.status === 'Realizada').length;
                const agendadas = sessoes.filter(s => s.status === 'Agendada').length;
                const faltas = sessoes.filter(s => s.status === 'Falta' || s.status === 'Cancelada').length;

                let recebido = 0;
                let pendente = 0;
                sessoes.forEach(s => {
                    const val = parseFloat(s.valor || 0);
                    if (s.pago) recebido += val;
                    else pendente += val;
                });

                // Verificação de Pendências em tempo real
                const pendencias = [];
                for (let s of sessoes) {
                    if (s.status === 'Realizada') {
                        const evo = evolucoes.find(e => e.sessaoId === s.id);
                        const pac = pacientes.find(p => p.id === s.pacienteId);
                        const pacNome = pac ? pac.nome : 'Paciente Desconhecido';

                        if (!evo) {
                            pendencias.push({ text: `🔴 Sessão realizada sem evolução: ${pacNome} (${s.data})`, link: () => this.navigate('prontuario', s.pacienteId) });
                        }
                        if (s.pago && !s.reciboAnexado) {
                            pendencias.push({ text: `🔴 Pagamento recebido sem recibo: ${pacNome} (${s.data})`, link: () => this.navigate('prontuario', s.pacienteId) });
                        }
                    }
                }

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h2 class="text-2xl font-bold text-brand-800">Painel Inicial (Dashboard)</h2>
                            <button onclick="app.navigate('cadastro-paciente')" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-4 py-2 rounded-xl shadow transition">
                                + Novo Paciente
                            </button>
                        </div>

                        <!-- CARDS DE METRICAS -->
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-brand-500">
                                <p class="text-xs text-gray-500 font-semibold uppercase">Total de Pacientes</p>
                                <p class="text-2xl font-bold text-gray-800 mt-1">${pacientes.length}</p>
                                <p class="text-xs text-gray-400 mt-1">${ativos} Ativos | ${inativos} Inativos</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-brand-500">
                                <p class="text-xs text-gray-500 font-semibold uppercase">Sessões Realizadas</p>
                                <p class="text-2xl font-bold text-gray-800 mt-1">${realizadas}</p>
                                <p class="text-xs text-gray-400 mt-1">${agendadas} Agendadas | ${faltas} Faltas/Canc.</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
                                <p class="text-xs text-gray-500 font-semibold uppercase">Valores Recebidos</p>
                                <p class="text-2xl font-bold text-green-600 mt-1">R$ ${recebido.toFixed(2)}</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500">
                                <p class="text-xs text-gray-500 font-semibold uppercase">Valores Pendentes</p>
                                <p class="text-2xl font-bold text-red-600 mt-1">R$ ${pendente.toFixed(2)}</p>
                            </div>
                        </div>

                        <!-- PAINEL DE PENDÊNCIAS EM VERMELHO -->
                        <div class="bg-white p-6 rounded-xl shadow">
                            <h3 class="text-lg font-bold text-red-700 mb-3 flex items-center">
                                Avisos e Pendências Locais
                            </h3>
                            ${pendencias.length === 0 ? `
                                <p class="text-sm text-green-600 font-medium">🟢 Nenhuma pendência detectada. Prontuários atualizados!</p>
                            ` : `
                                <ul class="space-y-2">
                                    ${pendencias.map((p, idx) => `
                                        <li class="bg-red-50 border border-red-200 p-3 rounded-lg flex justify-between items-center text-sm text-red-800 font-medium">
                                            <span>${p.text}</span>
                                            <button onclick="app.triggerPendencia(${idx})" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded transition">Resolver</button>
                                        </li>
                                    `).join('')}
                                </ul>
                            `}
                        </div>
                    </div>
                `;

                this._tempPendencias = pendencias;
            }

            triggerPendencia(idx) {
                if (this._tempPendencias && this._tempPendencias[idx]) {
                    this._tempPendencias[idx].link();
                }
            }

            // -----------------------------------------------------------------
            // 2. GESTÃO E LISTAGEM DE PACIENTES COM FILTROS
            // -----------------------------------------------------------------
            async renderPacientes(container) {
                const pacientes = await this.db.getAll('pacientes');

                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h2 class="text-2xl font-bold text-brand-800">Gestão de Pacientes</h2>
                            <button onclick="app.navigate('cadastro-paciente')" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-4 py-2 rounded-xl shadow transition">
                                + Cadastrar Paciente
                            </button>
                        </div>

                        <!-- FILTROS -->
                        <div class="bg-white p-4 rounded-xl shadow flex flex-col md:flex-row gap-4">
                            <input type="text" id="filter-search" oninput="app.filterPacientes()" placeholder="Buscar pelo nome..." class="flex-1 border border-brand-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                            
                            <select id="filter-status" onchange="app.filterPacientes()" class="border border-brand-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                <option value="TODOS">Todos os Status</option>
                                <option value="Ativo" selected>Ativos</option>
                                <option value="Inativo">Inativos</option>
                            </select>

                            <select id="filter-tipo" onchange="app.filterPacientes()" class="border border-brand-200 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                                <option value="TODOS">Todos os Tipos</option>
                                <option value="Adulto">Adulto</option>
                                <option value="Infantil">Infantil</option>
                            </select>
                        </div>

                        <!-- TABELA/LISTA -->
                        <div class="bg-white rounded-xl shadow overflow-hidden">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-brand-100 text-brand-900 text-xs font-bold uppercase">
                                    <tr>
                                        <th class="p-4">Nome</th>
                                        <th class="p-4">Tipo</th>
                                        <th class="p-4">Contato</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4 text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="pacientes-list" class="divide-y divide-brand-50 text-sm">
                                    <!-- Renderizado via filterPacientes -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                this._pacientesCache = pacientes;
                this.filterPacientes();
            }

            filterPacientes() {
                const search = (document.getElementById('filter-search')?.value || '').toLowerCase();
                const status = document.getElementById('filter-status')?.value || 'TODOS';
                const tipo = document.getElementById('filter-tipo')?.value || 'TODOS';

                const list = this._pacientesCache.filter(p => {
                    const matchSearch = p.nome.toLowerCase().includes(search);
                    const matchStatus = status === 'TODOS' || p.status === status;
                    const matchTipo = tipo === 'TODOS' || p.tipoAtendimento === tipo;
                    return matchSearch && matchStatus && matchTipo;
                });

                const tbody = document.getElementById('pacientes-list');
                if (!tbody) return;

                if (list.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">Nenhum paciente encontrado com esses critérios.</td></tr>`;
                    return;
                }

                tbody.innerHTML = list.map(p => `
                    <tr class="hover:bg-brand-50 transition">
                        <td class="p-4 font-bold text-gray-800">${p.nome}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded-full text-xs font-semibold ${p.tipoAtendimento === 'Infantil' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">${p.tipoAtendimento}</span></td>
                        <td class="p-4 text-gray-600">${p.telefone || '-'}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded-full text-xs font-semibold ${p.status === 'Ativo' ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-600'}">
                                ${p.status}
                            </span>
                        </td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="app.navigate('prontuario', '${p.id}')" class="bg-brand-600 hover:bg-brand-700 text-white text-xs px-3 py-1.5 rounded-lg transition">
                                Abrir Prontuário
                            </button>
                            <button onclick="app.togglePacienteStatus('${p.id}')" class="text-xs text-gray-500 hover:underline">
                                ${p.status === 'Ativo' ? 'Inativar' : 'Reativar'}
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            async togglePacienteStatus(id) {
                const paciente = await this.db.getById('pacientes', id);
                if (paciente) {
                    paciente.status = paciente.status === 'Ativo' ? 'Inativo' : 'Ativo';
                    await this.db.put('pacientes', paciente);
                    this.showToast(`Status do paciente alterado para ${paciente.status}.`);
                    this.renderPacientes(document.getElementById('app-content'));
                }
            }

            // -----------------------------------------------------------------
            // 3. FORMULÁRIO DE CADASTRO/EDIÇÃO DE PACIENTE (SALVAMENTO REAL)
            // -----------------------------------------------------------------
            async renderCadastroPaciente(container) {
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow space-y-4">
                        <h2 class="text-xl font-bold text-brand-800">Cadastrar Novo Paciente</h2>
                        
                        <form id="form-paciente" onsubmit="app.savePaciente(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700">Nome Completo *</label>
                                <input type="text" id="p-nome" required class="w-full border border-brand-200 rounded-lg p-2 mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-bold text-gray-700">Tipo de Atendimento *</label>
                                    <select id="p-tipo" onchange="app.toggleCamposInfantil(this.value)" required class="w-full border border-brand-200 rounded-lg p-2 mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
                                        <option value="Adulto">Adulto</option>
                                        <option value="Infantil">Infantil</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700">Telefone / WhatsApp</label>
                                    <input type="text" id="p-telefone" class="w-full border border-brand-200 rounded-lg p-2 mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-gray-700">E-mail</label>
                                <input type="email" id="p-email" class="w-full border border-brand-200 rounded-lg p-2 mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
                            </div>

                            <!-- CAMPOS ESPECÍFICOS PARA INFANTIL -->
                            <div id="campos-infantil" class="hidden border-t border-brand-100 pt-4 space-y-3">
                                <h3 class="text-sm font-bold text-brand-700">Informações do Responsável Legal</h3>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-600">Nome do Responsável</label>
                                    <input type="text" id="p-resp-nome" class="w-full border border-brand-200 rounded-lg p-2 mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-600">Parentesco</label>
                                        <input type="text" id="p-resp-parentesco" class="w-full border border-brand-200 rounded-lg p-2 mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-gray-600">Telefone do Responsável</label>
                                        <input type="text" id="p-resp-telefone" class="w-full border border-brand-200 rounded-lg p-2 mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
                                    </div>
                                </div>
                            </div>

                            <div class="flex justify-end space-x-3 pt-4">
                                <button type="button" onclick="app.goBack()" class="px-4 py-2 text-sm text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100">Cancelar</button>
                                <button type="submit" class="px-6 py-2 text-sm bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-lg transition shadow">
                                    Salvar Paciente
                                </button>
                            </div>
                        </form>
                    </div>
                `;
            }

            toggleCamposInfantil(val) {
                const fields = document.getElementById('campos-infantil');
                if (val === 'Infantil') fields.classList.remove('hidden');
                else fields.classList.add('hidden');
            }

            async savePaciente(e) {
                e.preventDefault();
                try {
                    const paciente = {
                        id: 'pac_' + Date.now(),
                        nome: document.getElementById('p-nome').value.trim(),
                        tipoAtendimento: document.getElementById('p-tipo').value,
                        telefone: document.getElementById('p-telefone').value.trim(),
                        email: document.getElementById('p-email').value.trim(),
                        status: 'Ativo',
                        responsavel: {
                            nome: document.getElementById('p-resp-nome')?.value.trim() || '',
                            parentesco: document.getElementById('p-resp-parentesco')?.value.trim() || '',
                            telefone: document.getElementById('p-resp-telefone')?.value.trim() || ''
                        },
                        dataCriacao: new Date().toISOString()
                    };

                    if (!paciente.nome) {
                        this.showToast('Erro: Informe o nome do paciente.', true);
                        return;
                    }

                    await this.db.put('pacientes', paciente);
                    this.showToast('🟢 PACIENTE REGISTRADO COM SUCESSO!');
                    this.navigate('prontuario', paciente.id);
                } catch (err) {
                    this.showToast('Erro ao tentar salvar o paciente.', true);
                }
            }

            // -----------------------------------------------------------------
            // 4. PRONTUÁRIO INDIVIDUAL DO PACIENTE (VISUALIZAÇÃO COMPLETA)
            // -----------------------------------------------------------------
            async renderProntuario(container, pacienteId) {
                const paciente = await this.db.getById('pacientes', pacienteId);
                if (!paciente) {
                    container.innerHTML = `<div class="p-4 text-red-600 font-bold">Paciente não encontrado.</div>`;
                    return;
                }

                const sessoes = await this.db.getByIndex('sessoes', 'pacienteId', pacienteId);
                const evolucoes = await this.db.getByIndex('evolucoes', 'pacienteId', pacienteId);
                const pdfs = await this.db.getByIndex('pdf_documentos', 'pacienteId', pacienteId);

                sessoes.sort((a, b) => new Date(b.data) - new Date(a.data));

                container.innerHTML = `
                    <div class="space-y-6">
                        <!-- HEADER PACIENTE -->
                        <div class="bg-white p-6 rounded-xl shadow flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-l-8 border-brand-600">
                            <div>
                                <h2 class="text-2xl font-bold text-gray-800">${paciente.nome}</h2>
                                <p class="text-sm text-gray-500 mt-1">
                                    Tipo: <strong class="text-brand-700">${paciente.tipoAtendimento}</strong> | 
                                    Contato: ${paciente.telefone || 'Não informado'} | 
                                    Status: <span class="font-bold ${paciente.status === 'Ativo' ? 'text-green-600' : 'text-gray-500'}">${paciente.status}</span>
                                </p>
                                ${paciente.tipoAtendimento === 'Infantil' ? `
                                    <p class="text-xs text-purple-700 mt-1 font-medium">
                                        Responsável: ${paciente.responsavel?.nome} (${paciente.responsavel?.parentesco}) - Tel: ${paciente.responsavel?.telefone}
                                    </p>
                                ` : ''}
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="app.openNovaSessaoModal('${paciente.id}')" class="bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm px-4 py-2 rounded-lg transition shadow">
                                    + Registrar Nova Sessão
                                </button>
                                <button onclick="app.gerarPDFSemanalIntegral('${paciente.id}')" class="bg-purple-600 hover:bg-purple-700 text-white font-bold text-sm px-4 py-2 rounded-lg transition shadow">
                                    ✨ Gerar PDF Integral
                                </button>
                            </div>
                        </div>

                        <!-- LISTA DE SESSÕES E EVOLUÇÕES -->
                        <div class="bg-white p-6 rounded-xl shadow space-y-4">
                            <h3 class="text-lg font-bold text-brand-800 border-b border-brand-100 pb-2">Histórico de Sessões e Evoluções</h3>
                            
                            ${sessoes.length === 0 ? `
                                <p class="text-sm text-gray-500 py-4">Nenhuma sessão registrada para este paciente ainda.</p>
                            ` : `
                                <div class="space-y-4">
                                    ${sessoes.map(s => {
                                        const evo = evolucoes.find(e => e.sessaoId === s.id);
                                        return `
                                            <div class="border border-brand-100 rounded-xl p-4 bg-brand-50/30 space-y-3">
                                                <div class="flex flex-col md:flex-row justify-between md:items-center gap-2 border-b border-brand-100 pb-2">
                                                    <div>
                                                        <span class="font-bold text-brand-900 text-base">Sessão: ${s.data} (${s.horario || 'Horário n/i'})</span>
                                                        <span class="ml-2 text-xs px-2 py-0.5 rounded font-semibold ${
                                                            s.status === 'Realizada' ? 'bg-green-100 text-green-800' :
                                                            s.status === 'Agendada' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800'
                                                        }">${s.status}</span>
                                                    </div>
                                                    <div class="flex items-center space-x-2 text-sm">
                                                        <span class="font-bold text-gray-700">R$ ${parseFloat(s.valor || 0).toFixed(2)}</span>
                                                        <button onclick="app.togglePagamento('${s.id}')" class="text-xs px-2 py-1 rounded font-bold ${s.pago ? 'bg-green-600 text-white' : 'bg-yellow-500 text-white'}">
                                                            ${s.pago ? 'Pago' : 'Pendente'}
                                                        </button>
                                                        <button onclick="app.toggleRecibo('${s.id}')" class="text-xs px-2 py-1 rounded border border-gray-300 ${s.reciboAnexado ? 'bg-green-50 text-green-700 border-green-300' : 'bg-red-50 text-red-600 border-red-300'}">
                                                            ${s.reciboAnexado ? '🟢 Recibo Anexado' : '🔴 Sem Recibo'}
                                                        </button>
                                                    </div>
                                                </div>

                                                <!-- PAINEL DA EVOLUÇÃO -->
                                                <div>
                                                    ${evo ? `
                                                        <div class="bg-white p-4 rounded-lg border border-brand-200 space-y-2">
                                                            <div class="flex justify-between items-center">
                                                                <span class="text-xs font-bold text-green-700 uppercase">🟢 EVOLUÇÃO SALVA NO BANCO</span>
                                                                <button onclick="app.navigate('evolucao-form', { pacienteId: '${paciente.id}', sessaoId: '${s.id}' })" class="text-xs bg-brand-100 text-brand-800 hover:bg-brand-200 font-bold px-3 py-1 rounded">
                                                                    Editar Evolução
                                                                </button>
                                                            </div>
                                                            <div class="text-xs text-gray-700 space-y-1">
                                                                <p><strong>Queixa Principal / Relato:</strong> ${evo.queixa}</p>
                                                                <p><strong>Demanda Trabalhada:</strong> ${evo.demanda}</p>
                                                                <p><strong>Descrição Detalhada:</strong> ${evo.descricao}</p>
                                                                <p><strong>Análise Técnica e Evolução:</strong> ${evo.analise}</p>
                                                            </div>
                                                        </div>
                                                    ` : `
                                                        <div class="flex justify-between items-center bg-red-50 p-3 rounded-lg border border-red-200">
                                                            <span class="text-xs font-bold text-red-700">🔴 EVOLUÇÃO PENDENTE DESTA SESSÃO</span>
                                                            <button onclick="app.navigate('evolucao-form', { pacienteId: '${paciente.id}', sessaoId: '${s.id}' })" class="text-xs bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1.5 rounded shadow">
                                                                Preencher e Salvar Evolução
                                                            </button>
                                                        </div>
                                                    `}
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }

            async togglePagamento(sessaoId) {
                const s = await this.db.getById('sessoes', sessaoId);
                if (s) {
                    s.pago = !s.pago;
                    await this.db.put('sessoes', s);
                    this.showToast('Status de pagamento atualizado!');
                    this.render();
                }
            }

            async toggleRecibo(sessaoId) {
                const s = await this.db.getById('sessoes', sessaoId);
                if (s) {
                    s.reciboAnexado = !s.reciboAnexado;
                    await this.db.put('sessoes', s);
                    this.showToast('Status do recibo atualizado!');
                    this.render();
                }
            }

            async openNovaSessaoModal(pacienteId) {
                const dataStr = prompt("Data da sessão (AAAA-MM-DD):", new Date().toISOString().split('T')[0]);
                if (!dataStr) return;

                const novaSessao = {
                    id: 'ses_' + Date.now(),
                    pacienteId: pacienteId,
                    data: dataStr,
                    horario: '14:00',
                    status: 'Realizada',
                    valor: 150.00,
                    pago: false,
                    reciboAnexado: false
                };

                await this.db.put('sessoes', novaSessao);
                this.showToast('Sessão criada com sucesso!');
                this.render();
            }

            // -----------------------------------------------------------------
            // 5. REGRA FUNDAMENTAL: FORMULÁRIO E PERSISTÊNCIA DA EVOLUÇÃO
            // -----------------------------------------------------------------
            async renderEvolucaoForm(container, params) {
                const { pacienteId, sessaoId } = params;
                const paciente = await this.db.getById('pacientes', pacienteId);
                const sessao = await this.db.getById('sessoes', sessaoId);
                const evolucoes = await this.db.getByIndex('evolucoes', 'sessaoId', sessaoId);
                const evolucaoExistente = evolucoes.length > 0 ? evolucoes[0] : null;

                container.innerHTML = `
                    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow space-y-6 border-t-4 border-brand-600">
                        <div>
                            <h2 class="text-xl font-bold text-brand-800">Registrar / Editar Evolução do Prontuário</h2>
                            <p class="text-xs text-gray-500 mt-1">
                                Paciente: <strong class="text-gray-800">${paciente.nome}</strong> | Sessão de: <strong class="text-gray-800">${sessao.data}</strong>
                            </p>
                        </div>

                        <form id="form-evolucao" onsubmit="app.salvarEvolucaoDefinitiva(event, '${pacienteId}', '${sessaoId}')" class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Queixa Principal / Relato</label>
                                <textarea id="evo-queixa" rows="3" required class="w-full border border-brand-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-brand-500 outline-none">${evolucaoExistente?.queixa || ''}</textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Demanda Trabalhada</label>
                                <textarea id="evo-demanda" rows="3" required class="w-full border border-brand-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-brand-500 outline-none">${evolucaoExistente?.demanda || ''}</textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Descrição Detalhada da Sessão</label>
                                <textarea id="evo-descricao" rows="5" required class="w-full border border-brand-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-brand-500 outline-none">${evolucaoExistente?.descricao || ''}</textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-1">Análise Técnica e Evolução</label>
                                <textarea id="evo-analise" rows="5" required class="w-full border border-brand-200 rounded-lg p-3 text-sm focus:ring-2 focus:ring-brand-500 outline-none">${evolucaoExistente?.analise || ''}</textarea>
                            </div>

                            <div class="p-4 bg-brand-50 rounded-lg border border-brand-200 flex justify-between items-center">
                                <span class="text-xs font-semibold text-brand-800">
                                    ⚠️ A evolução será permanentemente salva no Banco de Dados local antes de estar disponível para PDF.
                                </span>
                                <div class="space-x-2">
                                    <button type="button" onclick="app.goBack()" class="px-4 py-2 text-sm text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-100">Cancelar</button>
                                    <button type="submit" class="px-6 py-2 text-sm bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-lg transition shadow">
                                        💾 SALVAR EVOLUÇÃO
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                `;
            }

            async salvarEvolucaoDefinitiva(e, pacienteId, sessaoId) {
                e.preventDefault();
                try {
                    const evolucoes = await this.db.getByIndex('evolucoes', 'sessaoId', sessaoId);
                    const evolucaoExistente = evolucoes.length > 0 ? evolucoes[0] : null;

                    const novaEvolucao = {
                        id: evolucaoExistente ? evolucaoExistente.id : 'evo_' + Date.now(),
                        pacienteId: pacienteId,
                        sessaoId: sessaoId,
                        queixa: document.getElementById('evo-queixa').value.trim(),
                        demanda: document.getElementById('evo-demanda').value.trim(),
                        descricao: document.getElementById('evo-descricao').value.trim(),
                        analise: document.getElementById('evo-analise').value.trim(),
                        dataAtualizacao: new Date().toISOString()
                    };

                    await this.db.put('evolucoes', novaEvolucao);

                    // Notificação Obrigatória
                    this.showToast('🟢 EVOLUÇÃO SALVA COM SUCESSO');
                    this.navigate('prontuario', pacienteId);
                } catch (err) {
                    this.showToast('🔴 ERRO AO SALVAR EVOLUÇÃO. NENHUM DADO FOI PERDIDO.', true);
                }
            }

            // -----------------------------------------------------------------
            // 6. GERAÇÃO DE PDF INTEGRAL VIA DADOS PERSISTIDOS
            // -----------------------------------------------------------------
            async gerarPDFSemanalIntegral(pacienteId) {
                const paciente = await this.db.getById('pacientes', pacienteId);
                const sessoes = await this.db.getByIndex('sessoes', 'pacienteId', pacienteId);
                const evolucoes = await this.db.getByIndex('evolucoes', 'pacienteId', pacienteId);

                if (sessoes.length === 0) {
                    this.showToast('Não há sessões registradas para gerar o PDF.', true);
                    return;
                }

                this.showToast('Iniciando busca no banco e montagem do PDF Integral...');

                const pdfContainer = document.getElementById('pdf-container');
                pdfContainer.classList.remove('hidden');

                pdfContainer.innerHTML = `
                    <div style="font-family: Arial, sans-serif; padding: 20px;">
                        <div style="border-bottom: 2px solid #db2777; padding-bottom: 10px; margin-bottom: 20px;">
                            <h1 style="color: #db2777; font-size: 22px; font-weight: bold; margin: 0;">PRONTUÁRIO PSICOLÓGICO INTEGRAL</h1>
                            <p style="font-size: 12px; color: #555; margin: 5px 0 0 0;">Documento impresso diretamente dos dados persistidos do prontuário.</p>
                        </div>

                        <div style="background-color: #fdf2f8; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 12px;">
                            <p style="margin: 2px 0;"><strong>PACIENTE:</strong> ${paciente.nome}</p>
                            <p style="margin: 2px 0;"><strong>TIPO DE ATENDIMENTO:</strong> ${paciente.tipoAtendimento}</p>
                            <p style="margin: 2px 0;"><strong>CONTATO:</strong> ${paciente.telefone || 'N/A'}</p>
                            ${paciente.tipoAtendimento === 'Infantil' ? `<p style="margin: 2px 0;"><strong>RESPONSÁVEL:</strong> ${paciente.responsavel?.nome} (${paciente.responsavel?.parentesco})</p>` : ''}
                        </div>

                        <h2 style="font-size: 16px; color: #333; border-bottom: 1px solid #ccc; padding-bottom: 5px;">HISTÓRICO INTEGRAL DE EVOLUÇÕES</h2>

                        ${sessoes.map(s => {
                            const evo = evolucoes.find(e => e.sessaoId === s.id);
                            return `
                                <div class="pdf-avoid-break" style="margin-top: 15px; border: 1px solid #e5e7eb; padding: 12px; border-radius: 6px; font-size: 11px; line-height: 1.5;">
                                    <p style="background-color: #f3f4f6; padding: 4px 8px; font-weight: bold; margin-top: 0;">
                                        SESSÃO REALIZADA EM: ${s.data} (${s.horario})
                                    </p>
                                    ${evo ? `
                                        <div style="margin-top: 8px;">
                                            <p style="margin: 4px 0;"><strong>1. Queixa Principal / Relato:</strong><br>${evo.queixa.replace(/\n/g, '<br>')}</p>
                                            <p style="margin: 4px 0;"><strong>2. Demanda Trabalhada:</strong><br>${evo.demanda.replace(/\n/g, '<br>')}</p>
                                            <p style="margin: 4px 0;"><strong>3. Descrição Detalhada da Sessão:</strong><br>${evo.descricao.replace(/\n/g, '<br>')}</p>
                                            <p style="margin: 4px 0;"><strong>4. Análise Técnica e Evolução:</strong><br>${evo.analise.replace(/\n/g, '<br>')}</p>
                                        </div>
                                    ` : `
                                        <p style="color: red; font-style: italic;">[Sessão registrada sem evolução no banco de dados]</p>
                                    `}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;

                const opt = {
                    margin:       10,
                    filename:     `Prontuario_${paciente.nome.replace(/\s+/g, '_')}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2 },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(pdfContainer).save().then(() => {
                    pdfContainer.classList.add('hidden');
                    pdfContainer.innerHTML = '';
                    this.showToast('🟢 PDF Integral gerado com sucesso!');
                });
            }

            // -----------------------------------------------------------------
            // 7. PAINEL FINANCEIRO
            // -----------------------------------------------------------------
            async renderFinanceiro(container) {
                const sessoes = await this.db.getAll('sessoes');
                const pacientes = await this.db.getAll('pacientes');

                let totalRecebido = 0;
                let totalPendente = 0;

                sessoes.forEach(s => {
                    const val = parseFloat(s.valor || 0);
                    if (s.pago) totalRecebido += val;
                    else totalPendente += val;
                });

                container.innerHTML = `
                    <div class="space-y-6">
                        <h2 class="text-2xl font-bold text-brand-800">Controle Financeiro</h2>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-green-500">
                                <p class="text-sm font-semibold text-gray-500">Total Efectivamente Recebido</p>
                                <p class="text-3xl font-bold text-green-600 mt-2">R$ ${totalRecebido.toFixed(2)}</p>
                            </div>
                            <div class="bg-white p-6 rounded-xl shadow border-l-4 border-yellow-500">
                                <p class="text-sm font-semibold text-gray-500">Total a Receber (Pendente)</p>
                                <p class="text-3xl font-bold text-yellow-600 mt-2">R$ ${totalPendente.toFixed(2)}</p>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl shadow overflow-hidden">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-brand-100 text-brand-900 text-xs font-bold uppercase">
                                    <tr>
                                        <th class="p-4">Data</th>
                                        <th class="p-4">Paciente</th>
                                        <th class="p-4">Valor</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4">Recibo</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-brand-50 text-sm">
                                    ${sessoes.map(s => {
                                        const pac = pacientes.find(p => p.id === s.pacienteId);
                                        return `
                                            <tr class="hover:bg-brand-50">
                                                <td class="p-4">${s.data}</td>
                                                <td class="p-4 font-bold">${pac ? pac.nome : 'N/A'}</td>
                                                <td class="p-4 font-semibold">R$ ${parseFloat(s.valor || 0).toFixed(2)}</td>
                                                <td class="p-4">
                                                    <span class="px-2 py-1 rounded text-xs font-bold ${s.pago ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                                                        ${s.pago ? 'Pago' : 'Pendente'}
                                                    </span>
                                                </td>
                                                <td class="p-4">
                                                    <span class="text-xs font-bold ${s.reciboAnexado ? 'text-green-600' : 'text-red-600'}">
                                                        ${s.reciboAnexado ? '🟢 Anexado' : '🔴 Sem Recibo'}
                                                    </span>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        }

        // Inicialização Global do Sistema
        const app = new App();
        window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
